apiVersion: apps/v1
kind: Deployment
metadata:
  name: glm-flash-agg
  labels:
    llm-d.ai/guide: glm-flash-agg
    llm-d.ai/model: glm-flash
    llm-d.ai/role: decode
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      llm-d.ai/guide: glm-flash-agg
      llm-d.ai/model: glm-flash
      llm-d.ai/role: decode
  template:
    metadata:
      labels:
        llm-d.ai/guide: glm-flash-agg
        llm-d.ai/model: glm-flash
        llm-d.ai/role: decode
    spec:
      containers:
        - name: modelserver
          image: vllm/vllm-openai:glm53-flash
          imagePullPolicy: Always
          command: ["/bin/bash", "-c"]
          args:
            - |-
              set -euo pipefail

              export VLLM_USE_V2_MODEL_RUNNER=1
              export MAX_CG_SIZE=$(( MAX_NUM_SEQS * (SPEC_TOKENS + 1) ))
              uv pip install --system instanttensor

              exec vllm serve "${MODEL}" \
                --port 8000 \
                --disable-access-log-for-endpoints=/health,/metrics,/v1/models \
                --max-num-seqs "${MAX_NUM_SEQS}" \
                --max-num-batched-tokens "${MAX_NUM_BATCHED_TOKENS}" \
                --max-cudagraph-capture-size "${MAX_CG_SIZE}" \
                --long-prefill-token-threshold "${LONG_PREFILL_TOKEN_THRESHOLD}" \
                --tensor-parallel-size 8 \
                --enable-expert-parallel \
                --moe-backend "${MOE_BACKEND}" \
                --speculative-config "{\"method\":\"mtp\",\"num_speculative_tokens\":${SPEC_TOKENS}}" \
                --no-enable-flashinfer-autotune \
                --load-format instanttensor \
                --language-model-only
                
          env:
            - name: MODEL
              value: "zai-org/GLM-5.3-Flash"
            - name: MOE_BACKEND
              value: "auto"
            - name: MAX_NUM_SEQS
              value: "32"
            - name: MAX_NUM_BATCHED_TOKENS
              value: "8192"
            - name: LONG_PREFILL_TOKEN_THRESHOLD
              value: "4096"
            - name: SPEC_TOKENS
              value: "3"
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: llm-d-hf-token
                  key: HF_TOKEN
            - name: TORCH_CPP_LOG_LEVEL
              value: ERROR
            - name: HF_HUB_CACHE
              value: /var/cache/huggingface
            - name: VLLM_CACHE_ROOT
              value: /var/cache/vllm/vllm
            - name: FLASHINFER_WORKSPACE_BASE
              value: /var/cache/vllm/flashinfer
            - name: CUDA_CACHE_PATH
              value: /var/cache/vllm/cuda
          ports:
            - name: modelserver
              containerPort: 8000
              protocol: TCP
          resources:
            requests:
              cpu: "64"
              memory: 512Gi
              ephemeral-storage: 1Ti
              nvidia.com/gpu: "8"
            limits:
              memory: 512Gi
              ephemeral-storage: 1Ti
              nvidia.com/gpu: "8"
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            - name: hf-cache
              mountPath: /var/cache/huggingface
            - name: jit-cache
              mountPath: /var/cache/vllm
          startupProbe:
            httpGet:
              path: /health
              port: modelserver
            initialDelaySeconds: 0
            periodSeconds: 1
            timeoutSeconds: 5
            failureThreshold: 2700
          readinessProbe:
            httpGet:
              path: /health
              port: modelserver
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: modelserver
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
        - name: hf-cache
          emptyDir: {}
        - name: jit-cache
          emptyDir: {}
---
# Direct access.
apiVersion: v1
kind: Service
metadata:
  name: glm-flash-svc
spec:
  selector:
    llm-d.ai/guide: glm-flash-agg
  ports:
    - name: http
      port: 80
      targetPort: modelserver
      protocol: TCP
