apiVersion: apps/v1
kind: Deployment
metadata:
  name: inkling-small
  labels:
    llm-d.ai/role: decode
    llm-d.ai/model: inkling-small
    llm-d.ai/guide: inkling-small
spec:
  replicas: 1
  selector:
    matchLabels:
      llm-d.ai/role: decode
      llm-d.ai/model: inkling-small
      llm-d.ai/guide: inkling-small
  template:
    metadata:
      labels:
        llm-d.ai/role: decode
        llm-d.ai/model: inkling-small
        llm-d.ai/guide: inkling-small
    spec:
      containers:
        - name: modelserver
          image: public.ecr.aws/q9t5s3a7/vllm-ci-test-repo:0841fed141e9cb18e4464c2b4ec74881cdd90654
          imagePullPolicy: Always
          command: ["vllm", "serve"]
          args:
            - 'thinkingmachines/Inkling-Small-NVFP4'
            - '--tokenizer-mode=inkling'
            - '--reasoning-parser=inkling'
            - '--tool-call-parser=inkling'
            - '--enable-auto-tool-choice'
            - '--trust-remote-code'
            - '--tensor-parallel-size=2'
            - '--kernel-config.enable_flashinfer_autotune=False'
            - '--speculative-config={"method":"mtp","num_speculative_tokens":1}'
            - '--moe-backend=humming'
            - '--max-model-len=300000'
            - '--max-num-seqs=128'
            - '--gpu-memory-utilization=0.85'
            - '--block-size=64'
          ports:
            - name: modelserver
              containerPort: 8000
              protocol: TCP
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: llm-d-hf-token
                  key: HF_TOKEN
            # Both required by the Inkling serving path.
            - name: VLLM_PREFIX_CACHE_RETENTION_INTERVAL
              value: "0"
            - name: VLLM_USE_V2_MODEL_RUNNER
              value: "1"
            - name: FLASH_ATTENTION_CUTE_DSL_CACHE_ENABLED
              value: "1"
            - name: TORCH_CPP_LOG_LEVEL
              value: "ERROR"
            # Cache locations, mounted from the `hf-cache` / `jit-cache` volumes
            # below. Base backs those with emptyDir, so each pod pays the weight
            # pull and the kernel JIT once; an overlay can swap in node-local
            # storage to amortize it (see overlays/coreweave).
            - name: HF_HUB_CACHE
              value: /var/cache/huggingface
            - name: VLLM_CACHE_ROOT
              value: /var/cache/vllm/vllm
            - name: FLASHINFER_WORKSPACE_BASE
              value: /var/cache/vllm/flashinfer
            - name: DO_NOT_TRACK
              value: "1"
          resources:
            limits:
              cpu: "16"
              memory: 64Gi
              nvidia.com/gpu: 2
            requests:
              cpu: "16"
              memory: 64Gi
              nvidia.com/gpu: 2
          volumeMounts:
            - mountPath: /var/cache/huggingface
              name: hf-cache
            - mountPath: /var/cache/vllm
              name: jit-cache
            - mountPath: /dev/shm
              name: shm
            - mountPath: /.config
              name: vllm-config
          startupProbe:
            httpGet:
              path: /v1/models
              port: modelserver
            initialDelaySeconds: 30
            periodSeconds: 30
            # 60min — covers a cold weight pull. Pods that find a warm cache
            # come up far faster.
            failureThreshold: 120
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: modelserver
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /v1/models
              port: modelserver
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
      volumes:
        # Per-pod scratch by default. Overlays that have node-local NVMe should
        # repoint these at it so the weight pull and the kernel JIT are paid once
        # per node rather than once per pod.
        - name: hf-cache
          emptyDir: {}
        - name: jit-cache
          emptyDir: {}
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
        - name: vllm-config
          emptyDir: {}
---
# Direct access for smoke tests. The EPP routes to pod IPs via the
# InferencePool, so it does not go through this Service.
apiVersion: v1
kind: Service
metadata:
  name: inkling-small-svc
  labels:
    llm-d.ai/model: inkling-small
spec:
  selector:
    llm-d.ai/role: decode
    llm-d.ai/model: inkling-small
    llm-d.ai/guide: inkling-small
  ports:
    - name: http
      port: 8000
      targetPort: modelserver
      protocol: TCP