# CoreWeave-specific layer over the portable aggregated Qwen3 deployment.
# Node-local NVMe caches are the only cluster-specific thing here -- Qwen3-4B is
# a single-GPU deployment, so there is no interconnect to configure.
#
#   kubectl apply -k aggregated/overlays/coreweave/qwen3 -n robshaw-dev
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../base/qwen3

components:
  - ../../../../components/coreweave-node-cache
