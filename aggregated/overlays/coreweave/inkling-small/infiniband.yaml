# NOT APPLIED by default -- see the commented-out entry in kustomization.yaml.
#
# Single-node TP=2 rides NVLink and needs none of this. Enable it when the
# aggregated deployment grows past a single node (multi-node TP/EP), at which
# point the pod needs a real IB device: `rdma/ib` is the extended resource
# CoreWeave's RDMA device plugin advertises, and the HCAs are named ibp* on
# these nodes. (The disaggregated deployment already runs with this on, via the
# shared ../../../../components/coreweave-infiniband -- which this file could be
# replaced by, since the two are the same patch.)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inkling-small
spec:
  template:
    spec:
      containers:
        - name: modelserver
          env:
            - name: NCCL_IB_HCA
              value: "ibp"
            - name: NVSHMEM_HCA_PREFIX
              value: "ibp"
          resources:
            limits:
              rdma/ib: "1"
            requests:
              rdma/ib: "1"
