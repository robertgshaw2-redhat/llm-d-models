# CoreWeave-specific layer over the portable aggregated Inkling deployment.
#
#   kubectl apply -k aggregated/overlays/coreweave/inkling-small -n robshaw-dev
#   kubectl kustomize aggregated/overlays/coreweave/inkling-small   # render only
#
# Warm the node caches first with ../../../../cache-warmer/overlays/coreweave.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../base/inkling-small

# /mnt/local NVMe for the HF weight and JIT kernel caches.
components:
  - ../../../../components/coreweave-node-cache

# InfiniBand is off: single-node TP=2 rides NVLink. Uncomment both lines when
# this grows to multi-node TP/EP -- infiniband.yaml has the details.
# patches:
#   - path: infiniband.yaml
