# GKE layer over the portable 16-GPU aggregated deployment in
# ../../../base/inkling-large.
#
# Everything in this directory is a property of the cluster, not of the model:
#   rdma-networking.yaml  the eight per-GPU RoCE NICs (annotations + resources)
#   node-cache.yaml       weights on the node's ephemeral SSD
#   placement.yaml        B200 nodeSelector + GCE topology packing
#
#   kubectl config use-context gke_llm-d-scale_us-west8_wide-ep-cluster-us-west8
#   kubectl apply -k aggregated/overlays/gke/inkling-large -n default
#   kubectl kustomize aggregated/overlays/gke/inkling-large   # render only
#
# Warm the node caches first with ../../../../cache-warmer/overlays/gke, whose
# hostPath has to match the one in node-cache.yaml. Two B200 nodes have to be
# free before this will schedule; scale the other B200 workloads to 0 first --
# in particular ../../../../disaggregated/overlays/gke/inkling-large, which
# wants the same pool.
#
# These three patches used to be deliberate near-copies of the disaggregated
# overlay's. They no longer are: the disaggregated overlays were converted to the
# shared components, so the copies below are the last ones left.
#   ../../../../components/gke-rdma-networking   == rdma-networking.yaml here
#   ../../../../components/gke-node-cache        == node-cache.yaml here
#   ../../../../components/gke-placement         == placement.yaml here, except
#     the affinity leans on the LWS group-key alone rather than also spelling out
#     guide/model in matchLabels (the group-key already implies them)
#
# So this overlay can drop all three files and become `resources:` + a
# `components:` list, exactly like disaggregated/overlays/gke/*. Until it does,
# a change to the cluster plumbing has to be made in both places.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../base/inkling-large

# All JSON 6902. LeaderWorkerSet is a CRD kustomize carries no schema for, so a
# strategic merge patch degrades to RFC 7386 semantics and replaces whole lists:
# a patch touching the container's resources would drop its image, command, and
# env. Each patch file explains its own ops; the ones with hardcoded list
# indices open with a `test` so a reordered base fails the build instead of
# silently patching the wrong entry.
patches:
  - path: rdma-networking.yaml
    target:
      kind: LeaderWorkerSet
      labelSelector: llm-d.ai/guide=inkling-large-agg
  - path: node-cache.yaml
    target:
      kind: LeaderWorkerSet
      labelSelector: llm-d.ai/guide=inkling-large-agg
  - path: placement.yaml
    target:
      kind: LeaderWorkerSet
      name: inkling-large
