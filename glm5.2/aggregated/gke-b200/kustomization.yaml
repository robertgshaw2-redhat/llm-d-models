apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../base
  
components:
  - ../../../components/gke-node-cache
  - ../../../components/gke-nccl-plugins


patches:
  - target:
      kind: Deployment
      name: glm
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: glm
      spec:
        template:
          spec:
            containers:
              - name: modelserver
                env:
                  - name: MODEL
                    value: RedHatAI/GLM-5.2-NVFP4-FP8
                  - name: MOE_BACKEND
                    value: "auto"
