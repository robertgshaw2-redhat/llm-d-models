# Inkling (large) decode on 8xB200 nodes.
#
# Cluster-agnostic, like prefill.yaml: RDMA plumbing, node placement, and the
# node-local weight cache come from an overlay (../gke-b200). Without one there
# are no RDMA devices, so DeepEP has no fabric to run the inter-node all2all
# over.
#
# Two 8xB200 nodes per group: TP=8 inside each node, DP=2 with hybrid LB across
# them, so the MoE runs EP=16 over DeepEP v2 on the RDMA fabric. Wide EP is the
# point of the decode side -- it is what keeps the 256-expert / 6-active MoE
# from being memory-bandwidth bound at low batch.
#
# Every pod runs the disagg routing sidecar on :8000 (the port the InferencePool
# targets); vLLM itself sits on :8200.
apiVersion: leaderworkerset.x-k8s.io/v1
kind: LeaderWorkerSet
metadata:
  name: inkling-large-decode
  labels:
    llm-d.ai/accelerator-variant: gpu
    llm-d.ai/accelerator-vendor: nvidia
    llm-d.ai/guide: inkling-large-pd
    llm-d.ai/inference-serving: "true"
    llm-d.ai/model: inkling-large
    llm-d.ai/role: decode
spec:
  replicas: 1
  startupPolicy: LeaderCreated
  leaderWorkerTemplate:
    restartPolicy: RecreateGroupOnPodRestart
    size: 1
    workerTemplate:
      metadata:
        labels:
          llm-d.ai/accelerator-variant: gpu
          llm-d.ai/accelerator-vendor: nvidia
          llm-d.ai/guide: inkling-large-pd
          llm-d.ai/inference-serving: "true"
          llm-d.ai/model: inkling-large
          llm-d.ai/role: decode
      spec:
        # Node placement -- nodeSelector and the group-packing topology affinity
        # -- is per-cluster and comes from the overlay; see
        # ../../../components/gke-placement. It matters more here than on
        # prefill: a decode group is two nodes doing EP=16 all2all.
        # Native sidecar (initContainer + restartPolicy: Always): up before vLLM
        # and alive for the pod's life. It owns :8000, fans the prompt out to the
        # EPP-chosen prefill pod, then hands the request to local vLLM on :8200.
        # --data-parallel-size=1 because each pod is exactly one local DP rank.
        initContainers:
          - name: routing-proxy
            image: ghcr.io/llm-d/llm-d-router-disagg-sidecar:v0.9.0
            imagePullPolicy: Always
            restartPolicy: Always
            args:
              - --port=8000
              - --vllm-port=8200
              - --data-parallel-size=1
              - --kv-connector=nixlv2
              - --zap-log-level=1
              - --secure-proxy=false
              - --enable-prefiller-sampling
            ports:
              - name: sidecar
                containerPort: 8000
                protocol: TCP
            securityContext:
              allowPrivilegeEscalation: false
              runAsNonRoot: true
        containers:
          - name: vllm
            image: vllm/vllm-openai:nightly
            imagePullPolicy: Always
            command: ["/bin/bash", "-c"]
            args:
              - |-
                set -euo pipefail

                DP_SIZE=$(( ${LWS_GROUP_SIZE:-1} * DP_SIZE_LOCAL ))
                START_RANK=$(( ${LWS_WORKER_INDEX:-0} * DP_SIZE_LOCAL ))

                # Each step proposes SPEC_TOKENS MTP drafts plus the verified
                # token, so a full batch of MAX_SEQS needs (SPEC_TOKENS+1)x the
                # token budget. Keep this tied to SPEC_TOKENS, not hardcoded.
                MAX_BATCHED_TOKENS=$(( MAX_SEQS * (SPEC_TOKENS + 1) ))

                export VLLM_USE_V2_MODEL_RUNNER=1
                export VLLM_PREFIX_CACHE_RETENTION_INTERVAL=0
                export VLLM_SSM_CONV_STATE_LAYOUT=DS
                export FLASH_ATTENTION_CUTE_DSL_CACHE_ENABLED=1

                export VLLM_WORKER_MULTIPROC_METHOD=spawn

                # --- image gap-fillers -------------------------------------
                # See prefill.yaml for why these exist; drop both once the image
                # ships NIXL and rdma-core v44.
                if [[ "${BOOTSTRAP_NIXL}" == "1" ]]; then
                  (uv pip install --system nixl nixl-cu13 \
                    || pip install --no-cache-dir nixl nixl-cu13)
                fi

                exec vllm serve "${MODEL}" \
                  --port 8200 \
                  --trust-remote-code \
                  --tokenizer-mode inkling \
                  --reasoning-parser inkling \
                  --tool-call-parser inkling \
                  --enable-auto-tool-choice \
                  --gpu-memory-utilization 0.9 \
                  --max-model-len 300000 \
                  --max-num-seqs "${MAX_SEQS}" \
                  --max-num-batched-tokens "${MAX_BATCHED_TOKENS}" \
                  --max-cudagraph-capture-size "${MAX_BATCHED_TOKENS}" \
                  --enable-prefix-caching \
                  --no-disable-hybrid-kv-cache-manager \
                  --enable-expert-parallel \
                  --tensor-parallel-size "${TP_SIZE}" \
                  --moe-backend auto \
                  --speculative-config "{\"method\":\"mtp\",\"num_speculative_tokens\":${SPEC_TOKENS}}" \
                  --no-enable-flashinfer-autotune \
                  --disable-access-log-for-endpoints=/health,/metrics,/v1/models \
                  --kv-transfer-config '{"kv_connector":"NixlConnector",
                        "kv_role":"kv_consumer",
                        "kv_load_failure_policy":"fail"}' \
                  --load-format fastsafetensors
            env:
              - name: MODEL
                value: thinkingmachines/Inkling-NVFP4
              - name: TP_SIZE
                value: "8"
              - name: DP_SIZE_LOCAL
                value: "1"
              - name: MAX_SEQS
                value: "128"
              - name: SPEC_TOKENS
                value: "1"
              - name: BOOTSTRAP_NIXL
                value: "1"
              - name: BOOTSTRAP_RDMA_CORE
                value: "1"
              - name: HF_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: llm-d-hf-token
                    key: HF_TOKEN
              - name: VLLM_ENGINE_READY_TIMEOUT_S
                value: "3000"
              - name: VLLM_HTTP_TIMEOUT_KEEP_ALIVE
                value: "120"
              - name: VLLM_LOGGING_LEVEL
                value: INFO
              - name: VLLM_SKIP_P2P_CHECK
                value: "1"
              - name: VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS
                value: "1"
              - name: VLLM_RANDOMIZE_DP_DUMMY_INPUTS
                value: "1"
              - name: TORCH_CPP_LOG_LEVEL
                value: ERROR
              - name: NVIDIA_GDRCOPY
                value: enabled
              - name: NVSHMEM_REMOTE_TRANSPORT
                value: ibgda
              - name: NVSHMEM_IB_ENABLE_IBGDA
                value: "true"
              - name: NVSHMEM_DISABLE_DMABUF
                value: "0"
              - name: NVSHMEM_BOOTSTRAP_UID_SOCK_IFNAME
                value: eth0
              - name: GLOO_SOCKET_IFNAME
                value: eth0
              - name: NCCL_SOCKET_IFNAME
                value: eth0
              - name: NCCL_TUNER_PLUGIN
                value: none
              - name: NCCL_NET_PLUGIN
                value: ""
              - name: VLLM_NIXL_SIDE_CHANNEL_HOST
                valueFrom:
                  fieldRef:
                    fieldPath: status.podIP
              - name: HF_HUB_CACHE
                value: /var/cache/huggingface
              - name: VLLM_CACHE_ROOT
                value: /var/cache/vllm/vllm
              - name: FLASHINFER_WORKSPACE_BASE
                value: /var/cache/vllm/flashinfer
              - name: CUDA_CACHE_PATH
                value: /var/cache/vllm/cuda
              - name: DO_NOT_TRACK
                value: "1"
            ports:
              - name: modelserver
                containerPort: 8200
                protocol: TCP
            # Per-NIC RDMA extended resources come from the overlay; see
            # prefill.yaml.
            resources:
              requests:
                cpu: "32"
                memory: 512Gi
                ephemeral-storage: 1Ti
                nvidia.com/gpu: "8"
              limits:
                memory: 512Gi
                ephemeral-storage: 1Ti
                nvidia.com/gpu: "8"
            securityContext:
              privileged: true
              runAsUser: 0
              runAsGroup: 0
              capabilities:
                add:
                  - IPC_LOCK
                  - SYS_RAWIO
            volumeMounts:
              - name: dshm
                mountPath: /dev/shm
              - name: hf-cache
                mountPath: /var/cache/huggingface
              - name: jit-cache
                mountPath: /var/cache/vllm
            # Probes target vLLM on :8200, not the sidecar -- pod readiness
            # should track the engine, which is the thing that can be slow.
            startupProbe:
              httpGet:
                path: /health
                port: modelserver
              initialDelaySeconds: 0
              periodSeconds: 1
              timeoutSeconds: 5
              failureThreshold: 2700
            readinessProbe:
              httpGet:
                path: /health
                port: modelserver
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 3
            livenessProbe:
              httpGet:
                path: /health
                port: modelserver
              periodSeconds: 30
              timeoutSeconds: 5
              failureThreshold: 3
        volumes:
          - name: dshm
            emptyDir:
              medium: Memory
              sizeLimit: 20Gi
          # Per-pod scratch by default; the overlay repoints hf-cache at
          # node-local SSD. See prefill.yaml.
          - name: hf-cache
            emptyDir: {}
          - name: jit-cache
            emptyDir: {}
