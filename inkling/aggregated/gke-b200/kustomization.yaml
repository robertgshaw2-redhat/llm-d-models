apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../base

components:
  - ../../../components/gke-node-cache
  - ../../../components/gke-nccl-plugins

# Model knobs for this cluster. A strategic merge patch, not JSON 6902: with a
# Deployment kustomize can merge the env list by name, so this does not depend
# on where MODEL and MOE_BACKEND sit in the base's list -- which matters,
# because the components above merge their own env vars in ahead of them.
patches:
  - target:
      kind: Deployment
      name: inkling
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: inkling
      spec:
        template:
          spec:
            containers:
              - name: modelserver
                env:
                  - name: MODEL
                    value: thinkingmachines/Inkling-NVFP4
                  - name: MOE_BACKEND
                    value: "auto"
