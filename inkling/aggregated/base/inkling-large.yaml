apiVersion: leaderworkerset.x-k8s.io/v1
kind: LeaderWorkerSet
metadata:
  name: inkling
  labels:
    llm-d.ai/accelerator-variant: gpu
    llm-d.ai/accelerator-vendor: nvidia
    llm-d.ai/guide: inkling-agg
    llm-d.ai/inference-serving: "true"
    llm-d.ai/model: inkling
    llm-d.ai/role: decode
spec:
  replicas: 2
  startupPolicy: LeaderCreated
  leaderWorkerTemplate:
    # A DP group is a single collective: losing one rank wedges the other, so
    # restart the whole group rather than leaving a half-formed one behind.
    restartPolicy: RecreateGroupOnPodRestart
    size: 1
    workerTemplate:
      metadata:
        labels:
          llm-d.ai/accelerator-variant: gpu
          llm-d.ai/accelerator-vendor: nvidia
          llm-d.ai/guide: inkling-agg
          llm-d.ai/inference-serving: "true"
          llm-d.ai/model: inkling
          llm-d.ai/role: decode
      spec:
        # No nodeSelector or affinity here: which nodes carry 8xB200 and what the
        # topology keys are called is per-cluster. The overlay adds both -- see
        # ../gke-b200/placement.yaml. It matters: the two nodes of a group run
        # an all2all every step, so a group split across topology blocks pays
        # for it continuously.
        containers:
          - name: vllm
            image: vllm/vllm-openai:nightly
            imagePullPolicy: Always
            command: ["/bin/bash", "-c"]
            args:
              - |-
                set -euo pipefail

                # LWS_GROUP_SIZE / LWS_WORKER_INDEX are injected by LWS. One
                # local DP rank per pod, so group size is the DP width and the
                # pod's worker index is its start rank.
                DP_SIZE=$(( ${LWS_GROUP_SIZE:-1} * DP_SIZE_LOCAL ))
                START_RANK=$(( ${LWS_WORKER_INDEX:-0} * DP_SIZE_LOCAL ))

                # Make DP args if needed.
                DP_ARGS=()
                if (( DP_SIZE > 1 )); then
                  DP_ARGS=(
                    --data-parallel-size "${DP_SIZE}"
                    --data-parallel-size-local "${DP_SIZE_LOCAL}"
                    --data-parallel-start-rank "${START_RANK}"
                    --data-parallel-address "${LWS_LEADER_ADDRESS}"
                    --data-parallel-rpc-port 5555
                    --data-parallel-hybrid-lb
                  )
                fi

                # Inkling serving path: both are required, and DS is the conv
                # state layout for the model's sconv layers.
                export VLLM_USE_V2_MODEL_RUNNER=1
                export VLLM_PREFIX_CACHE_RETENTION_INTERVAL=0
                export VLLM_SSM_CONV_STATE_LAYOUT=DS
                export FLASH_ATTENTION_CUTE_DSL_CACHE_ENABLED=1

                # Decode-only steps are what cudagraphs pay off on: a full batch
                # proposes SPEC_TOKENS MTP drafts plus the verified token per
                # sequence. Tied to SPEC_TOKENS rather than hardcoded.
                MAX_CUDAGRAPH_SIZE=$(( MAX_SEQS * (SPEC_TOKENS + 1) ))

                exec vllm serve "${MODEL}" \
                  --port 8000 \
                  --trust-remote-code \
                  --tokenizer-mode inkling \
                  --reasoning-parser inkling \
                  --tool-call-parser inkling \
                  --enable-auto-tool-choice \
                  --gpu-memory-utilization 0.9 \
                  --max-num-seqs "${MAX_SEQS}" \
                  --max-num-batched-tokens "${MAX_BATCHED_TOKENS}" \
                  --max-cudagraph-capture-size "${MAX_CUDAGRAPH_SIZE}" \
                  --long-prefill-token-threshold 4096 \
                  --enable-prefix-caching \
                  --no-disable-hybrid-kv-cache-manager \
                  --enable-expert-parallel \
                  --tensor-parallel-size "${TP_SIZE}" \
                  "${DP_ARGS[@]}" \
                  --moe-backend auto \
                  --speculative-config "{\"method\":\"mtp\",\"num_speculative_tokens\":${SPEC_TOKENS}}" \
                  --no-enable-flashinfer-autotune \
                  --disable-access-log-for-endpoints=/health,/metrics,/v1/models \
                  --load-format fastsafetensors
            env:
              - name: MODEL
                value: thinkingmachines/Inkling-NVFP4
              - name: TP_SIZE
                value: "8"
              # One DP rank per pod. TP_SIZE x DP_SIZE_LOCAL must equal the GPUs
              # requested below.
              - name: DP_SIZE_LOCAL
                value: "1"
              - name: MAX_SEQS
                value: "128"
              # Aggregated, so a step mixes chunked prefill with decode: this has
              # to be a prefill-sized budget, not a decode-sized one.
              - name: MAX_BATCHED_TOKENS
                value: "16384"
              - name: SPEC_TOKENS
                value: "8"
              - name: HF_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: llm-d-hf-token
                    key: HF_TOKEN
              # ~592GB of NVFP4 weights: a cold pull is slow enough that the
              # engine-ready timeout and the startup probe both have to allow
              # for it.
              - name: VLLM_ENGINE_READY_TIMEOUT_S
                value: "3000"
              - name: VLLM_HTTP_TIMEOUT_KEEP_ALIVE
                value: "120"
              - name: VLLM_LOGGING_LEVEL
                value: INFO
              - name: VLLM_SKIP_P2P_CHECK
                value: "1"
              - name: VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS
                value: "1"
              - name: VLLM_RANDOMIZE_DP_DUMMY_INPUTS
                value: "1"
              - name: TRITON_LIBCUDA_PATH
                value: /usr/local/nvidia/lib64
              - name: TORCH_CPP_LOG_LEVEL
                value: ERROR
              - name: NVIDIA_GDRCOPY
                value: enabled
              # DeepEP's inter-node all2all rides IBGDA over the RDMA fabric.
              # Inert without the devices an overlay attaches.
              - name: NVSHMEM_REMOTE_TRANSPORT
                value: ibgda
              - name: NVSHMEM_IB_ENABLE_IBGDA
                value: "true"
              - name: NVSHMEM_DISABLE_DMABUF
                value: "0"
              # Control plane -- DP/Gloo rendezvous and the NVSHMEM bootstrap --
              # stays on the pod network; only the data plane uses RDMA.
              - name: NVSHMEM_BOOTSTRAP_UID_SOCK_IFNAME
                value: eth0
              - name: GLOO_SOCKET_IFNAME
                value: eth0
              - name: NCCL_SOCKET_IFNAME
                value: eth0
              - name: NCCL_TUNER_PLUGIN
                value: none
              - name: NCCL_NET_PLUGIN
                value: ""
              # Weight and JIT cache locations. What backs them is the volumes'
              # business below -- per-pod scratch here, node-local SSD once an
              # overlay repoints them.
              - name: HF_HUB_CACHE
                value: /var/cache/huggingface
              - name: VLLM_CACHE_ROOT
                value: /var/cache/vllm/vllm
              - name: FLASHINFER_WORKSPACE_BASE
                value: /var/cache/vllm/flashinfer
              - name: CUDA_CACHE_PATH
                value: /var/cache/vllm/cuda
              - name: DO_NOT_TRACK
                value: "1"
            ports:
              - name: modelserver
                containerPort: 8000
                protocol: TCP
            # The per-NIC RDMA extended resources are cluster-specific and are
            # added by the overlay (rdma-networking.yaml on the GKE one).
            resources:
              requests:
                cpu: "64"
                memory: 512Gi
                ephemeral-storage: 1Ti
                nvidia.com/gpu: "8"
              limits:
                memory: 512Gi
                ephemeral-storage: 1Ti
                nvidia.com/gpu: "8"
            volumeMounts:
              - name: dshm
                mountPath: /dev/shm
              - name: hf-cache
                mountPath: /var/cache/huggingface
              - name: jit-cache
                mountPath: /var/cache/vllm
            startupProbe:
              httpGet:
                path: /health
                port: modelserver
              initialDelaySeconds: 0
              periodSeconds: 1
              timeoutSeconds: 5
              failureThreshold: 2700
            readinessProbe:
              httpGet:
                path: /health
                port: modelserver
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 3
            livenessProbe:
              httpGet:
                path: /health
                port: modelserver
              periodSeconds: 30
              timeoutSeconds: 5
              failureThreshold: 3
        volumes:
          - name: dshm
            emptyDir:
              medium: Memory
              sizeLimit: 2Gi
          # Per-pod scratch by default. An overlay with node-local SSD should
          # repoint hf-cache at it so ~592GB of weights is pulled once per node
          # rather than once per pod -- the GKE overlay does, in node-cache.yaml.
          - name: hf-cache
            emptyDir: {}
          - name: jit-cache
            emptyDir: {}
---
# Direct access.
apiVersion: v1
kind: Service
metadata:
  name: inkling-agg-svc
  labels:
    llm-d.ai/model: inkling
spec:
  selector:
    llm-d.ai/guide: inkling-agg
    llm-d.ai/model: inkling
    llm-d.ai/role: decode
  ports:
    - name: http
      port: 8000
      targetPort: modelserver
      protocol: TCP
