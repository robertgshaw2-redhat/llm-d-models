# Inkling (large) aggregated -- prefill and decode in the same engine.
#
# One pod == one 8xB200 node: TP=8 over NVLink, EP=8 inside the pod. A pod is
# self-contained, so the replicas are independent single-node instances and the
# EPP in ../router.values.yaml load-balances across them. There is no multi-node
# form of this deployment: sharding one engine across nodes needs a gang, which
# a Deployment cannot express -- see ../../disaggregated for the multi-node
# wide-EP shape.
#
# Cluster-agnostic: node placement and the node-local weight cache come from an
# overlay (../gke-b200, ../cks-h200).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inkling
  labels:
    llm-d.ai/guide: inkling-agg
    llm-d.ai/model: inkling
    llm-d.ai/role: decode
spec:
  replicas: 2
  # Recreate, not the default RollingUpdate: a surge pod would ask for a ninth
  # and tenth B200 GPU that no one has spare, so a rolling update sits Pending
  # instead of rolling. Take the old pods down first and accept the gap.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      llm-d.ai/guide: inkling-agg
      llm-d.ai/model: inkling
      llm-d.ai/role: decode
  template:
    metadata:
      labels:
        llm-d.ai/guide: inkling-agg
        llm-d.ai/model: inkling
        llm-d.ai/role: decode
    spec:
      containers:
        # `modelserver`, which is what every Deployment base in this repo calls
        # its vLLM container -- the Deployment patches in ../../../components
        # merge by that name.
        - name: modelserver
          image: vllm/vllm-openai:nightly
          imagePullPolicy: Always
          command: ["/bin/bash", "-c"]
          args:
            - |-
              set -euo pipefail

              # Inkling serving path: both are required, and DS is the conv
              # state layout for the model's sconv layers.
              export VLLM_USE_V2_MODEL_RUNNER=1
              export VLLM_SSM_CONV_STATE_LAYOUT=DS
              export FLASH_ATTENTION_CUTE_DSL_CACHE_ENABLED=1

              exec vllm serve "${MODEL}" \
                --port 8000 \
                --disable-access-log-for-endpoints=/health,/metrics,/v1/models \
                --trust-remote-code \
                --tokenizer-mode inkling \
                --reasoning-parser inkling \
                --tool-call-parser inkling \
                --enable-auto-tool-choice \
                --max-num-seqs "${MAX_NUM_SEQS}" \
                --max-num-batched-tokens "${MAX_NUM_BATCHED_TOKENS}" \
                --long-prefill-token-threshold "${LONG_PREFILL_TOKEN_THRESHOLD}" \
                --tensor-parallel-size 8 \
                --enable-expert-parallel \
                --moe-backend "${MOE_BACKEND}" \
                --no-enable-flashinfer-autotune \
                --speculative-config "{\"method\":\"mtp\",\"num_speculative_tokens\":${SPEC_TOKENS}}" \
                --gpu-memory-utilization 0.85
                
          env:
            - name: MODEL
              value: "thinkingmachines/Inkling-NVFP4"
            - name: MOE_BACKEND
              value: "auto"
            - name: MAX_NUM_SEQS
              value: "128"
            - name: MAX_NUM_BATCHED_TOKENS
              value: "8192"
            - name: LONG_PREFILL_TOKEN_THRESHOLD
              value: "4096"
            - name: SPEC_TOKENS
              value: "8"
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: llm-d-hf-token
                  key: HF_TOKEN
            - name: TORCH_CPP_LOG_LEVEL
              value: ERROR
            - name: HF_HUB_CACHE
              value: /var/cache/huggingface
            - name: VLLM_CACHE_ROOT
              value: /var/cache/vllm/vllm
            - name: FLASHINFER_WORKSPACE_BASE
              value: /var/cache/vllm/flashinfer
            - name: CUDA_CACHE_PATH
              value: /var/cache/vllm/cuda
          ports:
            - name: modelserver
              containerPort: 8000
              protocol: TCP
          resources:
            requests:
              cpu: "64"
              memory: 512Gi
              ephemeral-storage: 1Ti
              nvidia.com/gpu: "8"
            limits:
              memory: 512Gi
              ephemeral-storage: 1Ti
              nvidia.com/gpu: "8"
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            - name: hf-cache
              mountPath: /var/cache/huggingface
            - name: jit-cache
              mountPath: /var/cache/vllm
          startupProbe:
            httpGet:
              path: /health
              port: modelserver
            initialDelaySeconds: 0
            periodSeconds: 1
            timeoutSeconds: 5
            failureThreshold: 2700
          readinessProbe:
            httpGet:
              path: /health
              port: modelserver
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: modelserver
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
        - name: hf-cache
          emptyDir: {}
        - name: jit-cache
          emptyDir: {}
---
# Direct access.
apiVersion: v1
kind: Service
metadata:
  name: inkling-svc
spec:
  selector:
    llm-d.ai/guide: inkling-agg
  ports:
    - name: http
      port: 80
      targetPort: modelserver
      protocol: TCP
