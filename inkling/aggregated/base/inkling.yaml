apiVersion: leaderworkerset.x-k8s.io/v1
kind: LeaderWorkerSet
metadata:
  name: inkling
  labels:
    llm-d.ai/guide: inkling-agg
    llm-d.ai/model: inkling
    llm-d.ai/role: decode
spec:
  replicas: 2
  startupPolicy: LeaderCreated
  leaderWorkerTemplate:
    restartPolicy: RecreateGroupOnPodRestart
    size: 1
    workerTemplate:
      metadata:
        labels:
          llm-d.ai/guide: inkling-agg
          llm-d.ai/model: inkling
          llm-d.ai/role: decode
      spec:
        containers:
          - name: vllm
            image: vllm/vllm-openai:nightly
            imagePullPolicy: Always
            command: ["/bin/bash", "-c"]
            args:
              - |-
                set -euo pipefail

                # Inkling serving path: both are required, and DS is the conv
                # state layout for the model's sconv layers.
                export VLLM_USE_V2_MODEL_RUNNER=1
                export VLLM_SSM_CONV_STATE_LAYOUT=DS
                export FLASH_ATTENTION_CUTE_DSL_CACHE_ENABLED=1

                uv pip install --system instanttensor

                exec vllm serve "${MODEL}" \
                  --port 8000 \
                  --disable-access-log-for-endpoints=/health,/metrics,/v1/models \
                  --trust-remote-code \
                  --tokenizer-mode inkling \
                  --reasoning-parser inkling \
                  --tool-call-parser inkling \
                  --enable-auto-tool-choice \
                  --max-num-batched-tokens "${MAX_BATCHED_TOKENS}" \
                  --long-prefill-token-threshold "${LONG_PREFILL_TOKEN_THRESHOLD}" \
                  --tensor-parallel-size "${TP_SIZE}" \
                  --enable-expert-parallel \
                  --moe-backend "${MOE_BACKEND}" \
                  --speculative-config "{\"method\":\"mtp\",\"num_speculative_tokens\":${SPEC_TOKENS}}" \
                  --no-enable-flashinfer-autotune \
                  --load-format instanttensor
            env:
              - name: MODEL
                value: "thinkingmachines/Inkling-NVFP4"
              - name: MOE_BACKEND
                value: "auto"
              - name: TP_SIZE
                value: "8"
              - name: MAX_BATCHED_TOKENS
                value: "16384"
              - name: LONG_PREFILL_TOKEN_THRESHOLD
                value: "4096"
              - name: SPEC_TOKENS
                value: "8"
              - name: HF_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: llm-d-hf-token
                    key: HF_TOKEN
              - name: TRITON_LIBCUDA_PATH
                value: /usr/local/nvidia/lib64
              - name: TORCH_CPP_LOG_LEVEL
                value: ERROR
              # Weight and JIT cache locations. What backs them is the volumes'
              # business below -- per-pod scratch here, node-local SSD once an
              # overlay repoints them.
              - name: HF_HUB_CACHE
                value: /var/cache/huggingface
              - name: VLLM_CACHE_ROOT
                value: /var/cache/vllm/vllm
              - name: FLASHINFER_WORKSPACE_BASE
                value: /var/cache/vllm/flashinfer
              - name: CUDA_CACHE_PATH
                value: /var/cache/vllm/cuda
              - name: DO_NOT_TRACK
                value: "1"
            ports:
              - name: modelserver
                containerPort: 8000
                protocol: TCP
            resources:
              requests:
                cpu: "64"
                memory: 512Gi
                ephemeral-storage: 1Ti
                nvidia.com/gpu: "8"
              limits:
                memory: 512Gi
                ephemeral-storage: 1Ti
                nvidia.com/gpu: "8"
            volumeMounts:
              - name: dshm
                mountPath: /dev/shm
              - name: hf-cache
                mountPath: /var/cache/huggingface
              - name: jit-cache
                mountPath: /var/cache/vllm
            startupProbe:
              httpGet:
                path: /health
                port: modelserver
              initialDelaySeconds: 0
              periodSeconds: 1
              timeoutSeconds: 5
              failureThreshold: 2700
            readinessProbe:
              httpGet:
                path: /health
                port: modelserver
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 3
            livenessProbe:
              httpGet:
                path: /health
                port: modelserver
              periodSeconds: 30
              timeoutSeconds: 5
              failureThreshold: 3
        volumes:
          - name: dshm
            emptyDir:
              medium: Memory
              sizeLimit: 2Gi
          - name: hf-cache
            emptyDir: {}
          - name: jit-cache
            emptyDir: {}
---
# Direct access.
apiVersion: v1
kind: Service
metadata:
  name: inkling-svc
spec:
  selector:
    llm-d.ai/guide: inkling-agg
  ports:
    - name: http
      port: 80
      targetPort: modelserver
      protocol: TCP
