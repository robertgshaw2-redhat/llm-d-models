# Repoint the `hf-cache` volume at the node's ephemeral SSD.
#
# hostPath, not a PVC: it survives pod restarts on the same node, so ~592GB of
# NVFP4 weights is pulled once per node instead of once per pod. Nothing shares
# it across nodes -- a pod landing on a cold node re-downloads, which is what
# ../../../cache-warmer/overlays/gke exists to prevent. That warmer writes to
# this same path; the two are written down separately, so change them together.
# The disaggregated overlay points at the same directory, which is deliberate --
# the two deployments serve the same weights and can warm each other's nodes.
#
# `jit-cache` is deliberately left as the base's emptyDir. The kernel JIT output
# is cheap to regenerate and tied to the image, and a stale one on a long-lived
# node has caused more trouble than the rebuild costs.
#
# The whole volume entry is replaced rather than merged: a volume may carry only
# one source, so emptyDir has to go before hostPath can take its place. That
# makes the list index load-bearing, hence the `test`.
- op: test
  path: /spec/leaderWorkerTemplate/workerTemplate/spec/volumes/1/name
  value: hf-cache

- op: replace
  path: /spec/leaderWorkerTemplate/workerTemplate/spec/volumes/1
  value:
    name: hf-cache
    hostPath:
      path: /mnt/stateful_partition/kube-ephemeral-ssd/shared_disk/vllm-hf-cache/
      type: DirectoryOrCreate
