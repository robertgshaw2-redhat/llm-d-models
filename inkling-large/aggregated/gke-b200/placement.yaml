# Where the pods of a group land on this cluster.
#
# nodeSelector picks the B200 pool by GKE's accelerator label. The podAffinity
# keeps the two pods of one LWS group inside a GCE topology block, and
# preferably a subblock, so the EP=16 all2all stays on the short paths. Unlike
# the disaggregated deployment there is no second role to keep apart -- one
# group is the whole serving unit -- so this is a single file.
#
# `matchLabelKeys: [leaderworkerset.sigs.k8s.io/group-key]` is what makes this
# per-group: LWS stamps a unique key on every group's pods, and the scheduler
# ANDs it into the selector, so a pod is drawn toward its own group rather than
# toward every inkling-large pod in the namespace. Preferred, not required -- a
# group that cannot be packed should still schedule, just more slowly.
- op: add
  path: /spec/leaderWorkerTemplate/workerTemplate/spec/nodeSelector
  value:
    cloud.google.com/gke-accelerator: nvidia-b200

- op: add
  path: /spec/leaderWorkerTemplate/workerTemplate/spec/affinity
  value:
    podAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 2
          podAffinityTerm:
            labelSelector:
              matchLabels:
                llm-d.ai/guide: inkling-large-agg
                llm-d.ai/model: inkling-large
            matchLabelKeys:
              - leaderworkerset.sigs.k8s.io/group-key
            topologyKey: cloud.google.com/gce-topology-block
        - weight: 1
          podAffinityTerm:
            labelSelector:
              matchLabels:
                llm-d.ai/guide: inkling-large-agg
                llm-d.ai/model: inkling-large
            matchLabelKeys:
              - leaderworkerset.sigs.k8s.io/group-key
            topologyKey: cloud.google.com/gce-topology-subblock
