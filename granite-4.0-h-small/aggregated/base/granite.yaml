apiVersion: apps/v1
kind: Deployment
metadata:
  name: granite
  labels:
    llm-d.ai/guide: granite4-small-agg
    llm-d.ai/model: granite4-small
    llm-d.ai/role: decode
spec:
  replicas: 5
  strategy:
    type: Recreate
  selector:
    matchLabels:
      llm-d.ai/guide: granite4-small-agg
      llm-d.ai/model: granite4-small
      llm-d.ai/role: decode
  template:
    metadata:
      labels:
        llm-d.ai/guide: granite4-small-agg
        llm-d.ai/model: granite4-small
        llm-d.ai/role: decode
    spec:
      containers:
        - name: modelserver
          image: vllm/vllm-openai:nightly
          imagePullPolicy: Always
          command: ["/bin/bash", "-c"]
          args:
            - |-
              set -euo pipefail

              export VLLM_USE_V2_MODEL_RUNNER=1

              exec vllm serve "${MODEL}" \
                --port 8000 \
                --disable-access-log-for-endpoints=/health,/metrics,/v1/models \
                --prefix-match-unit 16
          env:
            - name: MODEL
              value: "ibm-granite/granite-4.0-h-small"
            - name: MOE_BACKEND
              value: "auto"
            - name: MAX_NUM_SEQS
              value: "128"
            - name: MAX_NUM_BATCHED_TOKENS
              value: "8192"
            - name: LONG_PREFILL_TOKEN_THRESHOLD
              value: "4096"
            - name: SPEC_TOKENS
              value: "8"
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: llm-d-hf-token
                  key: HF_TOKEN
            - name: TORCH_CPP_LOG_LEVEL
              value: ERROR
            - name: HF_HUB_CACHE
              value: /var/cache/huggingface
            - name: VLLM_CACHE_ROOT
              value: /var/cache/vllm/vllm
            - name: FLASHINFER_WORKSPACE_BASE
              value: /var/cache/vllm/flashinfer
            - name: CUDA_CACHE_PATH
              value: /var/cache/vllm/cuda
          ports:
            - name: modelserver
              containerPort: 8000
              protocol: TCP
          resources:
            requests:
              cpu: "8"
              memory: 32Gi
              ephemeral-storage: 100Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "8"
              memory: 32Gi
              ephemeral-storage: 100Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            - name: hf-cache
              mountPath: /var/cache/huggingface
            - name: jit-cache
              mountPath: /var/cache/vllm
          startupProbe:
            httpGet:
              path: /health
              port: modelserver
            initialDelaySeconds: 0
            periodSeconds: 1
            timeoutSeconds: 5
            failureThreshold: 2700
          readinessProbe:
            httpGet:
              path: /health
              port: modelserver
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: modelserver
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
        - name: hf-cache
          emptyDir: {}
        - name: jit-cache
          emptyDir: {}
---
# Direct access.
apiVersion: v1
kind: Service
metadata:
  name: granite4-small-agg-svc
spec:
  selector:
    llm-d.ai/guide: granite4-small-agg
  ports:
    - name: http
      port: 80
      targetPort: modelserver
      protocol: TCP
