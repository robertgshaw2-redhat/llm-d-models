# Inkling (large) prefill on 8xB200 nodes.
#
# Cluster-agnostic: the RDMA plumbing, the node placement, and the node-local
# weight cache all come from an overlay. ../../overlays/gke/inkling-large is the
# only one today -- read it alongside this file, because on its own this manifest
# has no RDMA devices and both DeepEP and the NIXL KV transfer fall back to TCP.
#
# One LWS group == one 8xB200 node: TP=8 over NVLink, EP=8 inside the group.
# Grow `size` to shard a group across nodes (DeepEP v2 over the RDMA fabric
# takes over for the inter-node all2all); grow `replicas` to add independent
# prefill instances. Weights are ~592GB NVFP4, so they fit comfortably in one
# node's 1.44TB of HBM -- multi-node here buys prefill throughput, not capacity.
apiVersion: leaderworkerset.x-k8s.io/v1
kind: LeaderWorkerSet
metadata:
  name: inkling-large-prefill
  labels:
    llm-d.ai/accelerator-variant: gpu
    llm-d.ai/accelerator-vendor: nvidia
    llm-d.ai/guide: inkling-large-pd
    llm-d.ai/inference-serving: "true"
    llm-d.ai/model: inkling-large
    llm-d.ai/role: prefill
spec:
  replicas: 1
  startupPolicy: LeaderCreated
  leaderWorkerTemplate:
    restartPolicy: RecreateGroupOnPodRestart
    # 1 == single node (TP=8, no DP). Bump to 2+ for a multi-node group; the
    # command below turns the DP flags on automatically once the group is >1.
    size: 1
    workerTemplate:
      metadata:
        labels:
          llm-d.ai/accelerator-variant: gpu
          llm-d.ai/accelerator-vendor: nvidia
          llm-d.ai/guide: inkling-large-pd
          llm-d.ai/inference-serving: "true"
          llm-d.ai/model: inkling-large
          llm-d.ai/role: prefill
      spec:
        # No nodeSelector or affinity here: which nodes carry 8xB200 and what the
        # topology keys are called is per-cluster. The overlay adds both -- see
        # ../../../components/gke-placement.
        containers:
          - name: vllm
            image: vllm/vllm-openai:nightly
            imagePullPolicy: Always
            command: ["/bin/bash", "-c"]
            args:
              - |-
                set -euo pipefail

                # Inkling serving path: both are required, and DS is the conv
                # state layout for the model's sconv layers.
                export VLLM_USE_V2_MODEL_RUNNER=1
                export VLLM_PREFIX_CACHE_RETENTION_INTERVAL=0
                export VLLM_SSM_CONV_STATE_LAYOUT=DS
                export FLASH_ATTENTION_CUTE_DSL_CACHE_ENABLED=1

                # --- image gap-fillers -------------------------------------
                # Both default on because the images we run here still ship
                # neither. Set the env vars to "0" once the image does.
                if [[ "${BOOTSTRAP_NIXL}" == "1" ]]; then
                  (uv pip install --system nixl nixl-cu13 \
                    || pip install --no-cache-dir nixl nixl-cu13)
                fi

                exec vllm serve "${MODEL}" \
                  --port 8000 \
                  --trust-remote-code \
                  --tokenizer-mode inkling \
                  --reasoning-parser inkling \
                  --tool-call-parser inkling \
                  --enable-auto-tool-choice \
                  --max-num-seqs 16 \
                  --max-num-batched-tokens 16384 \
                  --long-prefill-token-threshold 4096 \
                  --enable-prefix-caching \
                  --no-disable-hybrid-kv-cache-manager \
                  --enable-expert-parallel \
                  --tensor-parallel-size "${TP_SIZE}" \
                  --moe-backend auto \
                  --speculative-config "{\"method\":\"mtp\",\"num_speculative_tokens\":${SPEC_TOKENS}}" \
                  --no-enable-flashinfer-autotune \
                  --disable-access-log-for-endpoints=/health,/metrics,/v1/models \
                  --kv-transfer-config '{"kv_connector":"NixlConnector",
                        "kv_role":"kv_producer",
                        "kv_load_failure_policy":"fail"}' \
                  --load-format fastsafetensors
            env:
              - name: MODEL
                value: thinkingmachines/Inkling-NVFP4
              - name: TP_SIZE
                value: "8"
              - name: SPEC_TOKENS
                value: "1"
              - name: BOOTSTRAP_NIXL
                value: "1"
              - name: HF_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: llm-d-hf-token
                    key: HF_TOKEN
              # ~592GB of NVFP4 weights: a cold pull is slow enough that the
              # engine-ready timeout and the startup probe both have to allow
              # for it.
              - name: VLLM_ENGINE_READY_TIMEOUT_S
                value: "3000"
              - name: VLLM_HTTP_TIMEOUT_KEEP_ALIVE
                value: "120"
              - name: VLLM_LOGGING_LEVEL
                value: INFO
              - name: VLLM_SKIP_P2P_CHECK
                value: "1"
              - name: VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS
                value: "1"
              - name: VLLM_RANDOMIZE_DP_DUMMY_INPUTS
                value: "1"
              - name: TRITON_LIBCUDA_PATH
                value: /usr/local/nvidia/lib64
              - name: TORCH_CPP_LOG_LEVEL
                value: ERROR
              - name: NVIDIA_GDRCOPY
                value: enabled
              - name: NVSHMEM_BOOTSTRAP_UID_SOCK_IFNAME
                value: eth0
              - name: GLOO_SOCKET_IFNAME
                value: eth0
              - name: NCCL_SOCKET_IFNAME
                value: eth0
              - name: NCCL_TUNER_PLUGIN
                value: none
              - name: NCCL_NET_PLUGIN
                value: ""
              - name: VLLM_NIXL_SIDE_CHANNEL_HOST
                valueFrom:
                  fieldRef:
                    fieldPath: status.podIP
              # Weight and JIT cache locations. What backs them is the volumes'
              # business below -- per-pod scratch here, node-local SSD once an
              # overlay repoints them.
              - name: HF_HUB_CACHE
                value: /var/cache/huggingface
              - name: VLLM_CACHE_ROOT
                value: /var/cache/vllm/vllm
              - name: FLASHINFER_WORKSPACE_BASE
                value: /var/cache/vllm/flashinfer
              - name: CUDA_CACHE_PATH
                value: /var/cache/vllm/cuda
              - name: DO_NOT_TRACK
                value: "1"
            ports:
              - name: modelserver
                containerPort: 8000
                protocol: TCP
            # The per-NIC RDMA extended resources are cluster-specific and are
            # added by the overlay (rdma-networking.yaml on the GKE one).
            resources:
              requests:
                cpu: "64"
                memory: 256Gi
                ephemeral-storage: 1Ti
                nvidia.com/gpu: "8"
              limits:
                memory: 256Gi
                ephemeral-storage: 1Ti
                nvidia.com/gpu: "8"
            securityContext:
              # IBGDA needs to pin and map device memory from userspace.
              privileged: true
              runAsUser: 0
              runAsGroup: 0
              capabilities:
                add:
                  - IPC_LOCK
                  - SYS_RAWIO
            volumeMounts:
              - name: dshm
                mountPath: /dev/shm
              - name: hf-cache
                mountPath: /var/cache/huggingface
              - name: jit-cache
                mountPath: /var/cache/vllm
            # 45min at 1s: a cold weight pull plus the kernel JIT. Warm nodes
            # come up in a fraction of it.
            startupProbe:
              httpGet:
                path: /health
                port: modelserver
              initialDelaySeconds: 0
              periodSeconds: 1
              timeoutSeconds: 5
              failureThreshold: 2700
            readinessProbe:
              httpGet:
                path: /health
                port: modelserver
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 3
            livenessProbe:
              httpGet:
                path: /health
                port: modelserver
              periodSeconds: 30
              timeoutSeconds: 5
              failureThreshold: 3
        volumes:
          # 20Gi, not the 2Gi an aggregated deployment gets by: NIXL/UCX stages
          # the P/D KV transfers through shared memory.
          - name: dshm
            emptyDir:
              medium: Memory
              sizeLimit: 20Gi
          # Per-pod scratch by default. An overlay with node-local SSD should
          # repoint hf-cache at it so ~592GB of weights is pulled once per node
          # rather than once per pod -- the GKE overlay does, in node-cache.yaml.
          - name: hf-cache
            emptyDir: {}
          - name: jit-cache
            emptyDir: {}
