apiVersion: apps/v1
kind: Deployment
metadata:
  name: inkling-small-pd-prefill
  labels:
    llm-d.ai/role: prefill
    llm-d.ai/model: inkling-small
    llm-d.ai/guide: inkling-small-pd
spec:
  replicas: 4
  selector:
    matchLabels:
      llm-d.ai/role: prefill
      llm-d.ai/model: inkling-small
      llm-d.ai/guide: inkling-small-pd
  template:
    metadata:
      labels:
        llm-d.ai/role: prefill
        llm-d.ai/model: inkling-small
        llm-d.ai/guide: inkling-small-pd
    spec:
      containers:
        - name: modelserver
          image: vllm/vllm-openai:nightly
          imagePullPolicy: Always
          command: ["vllm", "serve"]
          args:
            - 'thinkingmachines/Inkling-Small-NVFP4'
            - '--tokenizer-mode=inkling'
            - '--reasoning-parser=inkling'
            - '--tool-call-parser=inkling'
            - '--enable-auto-tool-choice'
            - '--trust-remote-code'
            - '--tensor-parallel-size=2'
            - '--kernel-config.enable_flashinfer_autotune=False'
            - '--speculative-config={"method":"mtp","num_speculative_tokens":1}'
            - '--max-model-len=300000'
            - '--kv-transfer-config={"kv_connector":"NixlConnector","kv_role":"kv_producer"}'
            - '--disable-access-log-for-endpoints=/health,/metrics,/v1/models'
            - '--max-num-seqs=16'
            - '--moe-backend=humming'
            - '--max-num-batched-tokens=16384'
            - '--long-prefill-token-threshold=4096'
          ports:
            - name: modelserver
              containerPort: 8000
              protocol: TCP
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: llm-d-hf-token
                  key: HF_TOKEN
            # Both required by the Inkling serving path.
            - name: VLLM_PREFIX_CACHE_RETENTION_INTERVAL
              value: "0"
            - name: VLLM_USE_V2_MODEL_RUNNER
              value: "1"
            - name: FLASH_ATTENTION_CUTE_DSL_CACHE_ENABLED
              value: "1"
            - name: TORCH_CPP_LOG_LEVEL
              value: "ERROR"
            # Cache locations, mounted from the `hf-cache` / `jit-cache` volumes
            # below. Base backs those with emptyDir, so each pod pays the weight
            # pull and the kernel JIT once; an overlay can swap in node-local
            # storage to amortize it (see overlays/coreweave).
            - name: HF_HUB_CACHE
              value: /var/cache/huggingface
            - name: VLLM_CACHE_ROOT
              value: /var/cache/vllm/vllm
            - name: FLASHINFER_WORKSPACE_BASE
              value: /var/cache/vllm/flashinfer
            - name: DO_NOT_TRACK
              value: "1"
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: VLLM_NIXL_SIDE_CHANNEL_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: VLLM_HTTP_TIMEOUT_KEEP_ALIVE
              value: "120"
          resources:
            limits:
              cpu: "16"
              memory: 64Gi
              nvidia.com/gpu: 2
            requests:
              cpu: "16"
              memory: 64Gi
              nvidia.com/gpu: 2
          volumeMounts:
            - mountPath: /var/cache/huggingface
              name: hf-cache
            - mountPath: /var/cache/vllm
              name: jit-cache
            - mountPath: /dev/shm
              name: shm
            - mountPath: /.config
              name: vllm-config
          startupProbe:
            httpGet:
              path: /v1/models
              port: modelserver
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 120
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: modelserver
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /v1/models
              port: modelserver
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
      volumes:
        # Per-pod scratch by default. Overlays that have node-local NVMe should
        # repoint these at it so the weight pull and the kernel JIT are paid once
        # per node rather than once per pod.
        - name: hf-cache
          emptyDir: {}
        - name: jit-cache
          emptyDir: {}
        # P/D: 2Gi (the aggregated deployment's value) is tight once NIXL/UCX
        # is staging transfers through shared memory. 20Gi matches upstream.
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 20Gi
        - name: vllm-config
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inkling-small-pd-decode
  labels:
    llm-d.ai/role: decode
    llm-d.ai/model: inkling-small
    llm-d.ai/guide: inkling-small-pd
spec:
  replicas: 1
  selector:
    matchLabels:
      llm-d.ai/role: decode
      llm-d.ai/model: inkling-small
      llm-d.ai/guide: inkling-small-pd
  template:
    metadata:
      labels:
        llm-d.ai/role: decode
        llm-d.ai/model: inkling-small
        llm-d.ai/guide: inkling-small-pd
    spec:
      # P/D: native sidecar (initContainer + restartPolicy: Always) so it is up
      # before vLLM and stays up for the pod's life. It owns :8000 -- the port
      # the InferencePool routes to -- fans the prompt out to the EPP-chosen
      # prefill pod, then hands the request to local vLLM on :8200.
      initContainers:
        - name: routing-proxy
          image: ghcr.io/llm-d/llm-d-router-disagg-sidecar:v0.9.0
          imagePullPolicy: Always
          restartPolicy: Always
          args:
            - --port=8000
            - --vllm-port=8200
            - --kv-connector=nixlv2
            - --zap-log-level=1
            - --secure-proxy=false
          ports:
            - name: sidecar
              containerPort: 8000
              protocol: TCP
          resources: {}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
      containers:
        - name: modelserver
          image: vllm/vllm-openai:nightly
          imagePullPolicy: Always
          command: ["vllm", "serve"]
          args:
            - 'thinkingmachines/Inkling-Small-NVFP4'
            - '--port=8200'
            - '--tokenizer-mode=inkling'
            - '--reasoning-parser=inkling'
            - '--tool-call-parser=inkling'
            - '--enable-auto-tool-choice'
            - '--trust-remote-code'
            - '--tensor-parallel-size=8'
            - '--kernel-config.enable_flashinfer_autotune=False'
            - '--speculative-config={"method":"mtp","num_speculative_tokens":1}'
            - '--max-model-len=300000'
            - '--kv-transfer-config={"kv_connector":"NixlConnector","kv_role":"kv_consumer"}'
            - '--disable-access-log-for-endpoints=/health,/metrics,/v1/models'
            - '--max-num-seqs=128'
            - '--max-num-batched-tokens=256'
            - '--moe-backend=auto'
          ports:
            - name: modelserver
              containerPort: 8200
              protocol: TCP
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: llm-d-hf-token
                  key: HF_TOKEN
            - name: VLLM_PREFIX_CACHE_RETENTION_INTERVAL
              value: "0"
            - name: VLLM_USE_V2_MODEL_RUNNER
              value: "1"
            - name: FLASH_ATTENTION_CUTE_DSL_CACHE_ENABLED
              value: "1"
            - name: TORCH_CPP_LOG_LEVEL
              value: "ERROR"
            - name: HF_HUB_CACHE
              value: /var/cache/huggingface
            - name: VLLM_CACHE_ROOT
              value: /var/cache/vllm/vllm
            - name: FLASHINFER_WORKSPACE_BASE
              value: /var/cache/vllm/flashinfer
            - name: DO_NOT_TRACK
              value: "1"
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: VLLM_NIXL_SIDE_CHANNEL_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          resources:
            limits:
              cpu: "16"
              memory: 64Gi
              nvidia.com/gpu: 8
            requests:
              cpu: "16"
              memory: 64Gi
              nvidia.com/gpu: 8
          volumeMounts:
            - mountPath: /var/cache/huggingface
              name: hf-cache
            - mountPath: /var/cache/vllm
              name: jit-cache
            - mountPath: /dev/shm
              name: shm
            - mountPath: /.config
              name: vllm-config
          # Probes target vLLM on :8200, not the sidecar -- pod readiness
          # should track the engine, and the sidecar cannot serve anything
          # useful without it.
          startupProbe:
            httpGet:
              path: /v1/models
              port: modelserver
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 120
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: modelserver
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /v1/models
              port: modelserver
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
      volumes:
        - name: hf-cache
          emptyDir: {}
        - name: jit-cache
          emptyDir: {}
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 20Gi
        - name: vllm-config
          emptyDir: {}
