# Values for the llm-d EPP / InferencePool router in front of the disaggregated
# prefill+decode pods in inkling-small-pd.yaml (applied through
# overlays/coreweave/inkling-small). Cluster-agnostic, and a Helm values file
# rather than a manifest, so the kustomization does not list it.
#
# Deploy:
#   helm upgrade --install inkling-small oci://ghcr.io/llm-d/charts/llm-d-router-standalone --version v0.9.0 -n robshaw-dev -f disaggregated/base/inkling-small/router.values.yaml
#
# The release name drives the resource names: this creates the InferencePool
# `inkling-small` and the Service/Deployment `inkling-small-epp`, so the routed
# endpoint is http://inkling-small-epp:80 (the extraServicePorts 80->8081 map
# below). Uninstall with `helm uninstall inkling-small -n robshaw-dev`.
router:
  epp:
    replicas: 1
    flags:
      ha-enable-leader-election: false
    env:
      - name: HF_TOKEN
        valueFrom:
          secretKeyRef:
            name: llm-d-hf-token
            key: HF_TOKEN

    pluginsConfigFile: "inkling-small-pd-plugins.yaml"
    pluginsCustomConfig:
      inkling-small-pd-plugins.yaml: |
        apiVersion: llm-d.ai/v1alpha1
        kind: EndpointPickerConfig
        plugins:
          - type: disagg-headers-handler
          - type: always-disagg-pd-decider
          - type: disagg-profile-handler
            parameters:
              deciderPluginName: always-disagg-pd-decider
          - type: prefill-filter
          - type: decode-filter
          - type: approx-prefix-cache-producer
          - type: inflight-load-producer
          - type: prefix-cache-affinity-filter
            parameters:
              peakPrefillThroughput: 30000
          - type: token-load-scorer
          - type: active-request-scorer
          - type: max-score-picker
        schedulingProfiles:
        # Prefill does the prompt pass: keep prefix groups on cache-warm pods
        # (affinity filter) and pick by queued prefill token load.
        - name: prefill
          plugins:
          - pluginRef: prefill-filter
          - pluginRef: prefix-cache-affinity-filter
          - pluginRef: token-load-scorer
          - pluginRef: max-score-picker
        # Decode is bound by concurrent in-flight requests, not prefill
        # throughput: pick the least-busy endpoint.
        - name: decode
          plugins:
          - pluginRef: decode-filter
          - pluginRef: active-request-scorer
          - pluginRef: max-score-picker

  extraServicePorts:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 8081

  modelServers:
    type: vllm
    targetPorts:
      # 8000 on both roles: vLLM directly on prefill, the routing-proxy sidecar
      # on decode (vLLM itself sits on 8200 there).
      - number: 8000
    matchLabels:
      llm-d.ai/guide: "inkling-small-pd"
