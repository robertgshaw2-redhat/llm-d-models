apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen3
  labels:
    llm-d.ai/guide: qwen3.8-27b-agg
    llm-d.ai/model: qwen3.8-27b
    llm-d.ai/role: decode
spec:
  replicas: 1
  selector:
    matchLabels:
      llm-d.ai/guide: qwen3.8-27b-agg
      llm-d.ai/model: qwen3.8-27b
      llm-d.ai/role: decode
  template:
    metadata:
      labels:
        llm-d.ai/guide: qwen3.8-27b-agg
        llm-d.ai/model: qwen3.8-27b
        llm-d.ai/role: decode
    spec:
      containers:
        - name: modelserver
          image: vllm/vllm-openai:nightly
          imagePullPolicy: Always
          command: ["vllm", "serve"]
          args:
            - "$MODEL"
            - "--enable-auto-tool-choice"
            - "--tool-call-parser=qwen3_coder"
            - "--reasoning-parser=qwen3"
            - "--mm-encoder-tp-mode=data"
            - "--speculative-config.method=mtp"
            - "--speculative-config.num_speculative_tokens=3
          ports:
            - name: modelserver
              containerPort: 8000
              protocol: TCP
          env:
            - name: MODEL
              value: ""
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: llm-d-hf-token
                  key: HF_TOKEN
            - name: TORCH_CPP_LOG_LEVEL
              value: "ERROR"
            - name: HF_HUB_CACHE
              value: /var/cache/huggingface
            - name: VLLM_CACHE_ROOT
              value: /var/cache/vllm/vllm
            - name: FLASHINFER_WORKSPACE_BASE
              value: /var/cache/vllm/flashinfer
          resources:
            limits:
              cpu: "8"
              memory: 32Gi
              nvidia.com/gpu: 1
            requests:
              cpu: "8"
              memory: 32Gi
              nvidia.com/gpu: 1
          volumeMounts:
            - mountPath: /var/cache/huggingface
              name: hf-cache
            - mountPath: /var/cache/vllm
              name: jit-cache
            - mountPath: /dev/shm
              name: shm
            - mountPath: /.config
              name: vllm-config
          startupProbe:
            httpGet:
              path: /v1/models
              port: modelserver
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 120
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: modelserver
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /v1/models
              port: modelserver
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
      volumes:
        - name: hf-cache
          emptyDir: {}
        - name: jit-cache
          emptyDir: {}
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
        - name: vllm-config
          emptyDir: {}
---
# Direct access.
apiVersion: v1
kind: Service
metadata:
  name: qwen3.8-27b-svc
spec:
  selector:
    llm-d.ai/guide: qwen3.8-27b
  ports:
    - name: http
      port: 80
      targetPort: modelserver
      protocol: TCP
