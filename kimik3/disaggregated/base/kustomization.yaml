# Cluster-agnostic disaggregated (prefill + decode) Kimi-K3 deployment.
#
# Everything here is model/serving configuration. The cluster plumbing -- RDMA,
# node placement, node-local weight cache -- comes from the shared components
# under ../../../components, the same ones inkling-large uses.
#
# Do not apply this directly -- pick an overlay:
#   kubectl apply -k kimik3/disaggregated/gke-b200 -n default
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - prefill.yaml
  - decode.yaml
