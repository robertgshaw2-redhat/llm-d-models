# CoreWeave: node-local NVMe at /mnt/local, H200 nodes.
#
# The hostPath must stay in step with the hf-cache path in
# ../../../components/coreweave-node-cache/node-local-cache.yaml -- that
# component is what the vLLM pods mount, and a warmer writing anywhere else
# warms nothing.
#
# `emptyDir: null` deletes the base's per-pod scratch: a volume may only have one
# source, so it has to go before hostPath can take its place.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: hf-cache-warmer
spec:
  template:
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              # Set by NVIDIA GPU feature discovery; matches the 17 H200 nodes
              # and none of the CPU-only nodes.
              - matchExpressions:
                  - key: nvidia.com/gpu.present
                    operator: In
                    values: ["true"]
      tolerations:
        # The GPU nodes carry is_gpu=true:PreferNoSchedule.
        - key: is_gpu
          operator: Equal
          value: "true"
          effect: PreferNoSchedule
      volumes:
        - name: hf-cache
          emptyDir: null
          hostPath:
            path: /mnt/local/hf-cache
            type: DirectoryOrCreate
